function viewSeason(){
  const H = S.history;
  if (!H.length) return `<div class="card empty"><h3>No games saved yet</h3><p>After a game, tap “Save minutes to season” on the Rotation tab. Saved minutes are used to even things out the next game.</p></div>${backupHTML()}`;
  const R = ranked();
  const stat = {};
  H.forEach(g => Object.entries(g.mins || {}).forEach(([id, m]) => { const t = stat[id] = stat[id] || {gp:0, g:0, f:0}; t.gp++; t.g += m.g; t.f += m.f; }));
  const rows = R.map(p => { const t = stat[p.id] || {gp:0, g:0, f:0}; return `<tr><td>${nameHTML(p.id)}</td><td>${t.gp}</td><td>${t.gp ? mins(t.g / t.gp) : '–'}</td><td>${t.gp ? mins(t.f / t.gp) : '–'}</td><td>${mins(t.g + t.f)}</td></tr>`; }).join('');
  return `
  <section class="block">
    <div class="block-head"><h2>Season minutes</h2><p class="sub num">${H.length} game${H.length > 1 ? 's' : ''} saved</p></div>
    <div class="grid-wrap"><table class="stable"><thead><tr><th>Player</th><th>GP</th><th>Avg game</th><th>Avg 5th</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>
  ${impactHTML()}
  ${lineupsHTML()}
  <section class="block">
    <h2>Games</h2>
    <div class="games">${H.slice().reverse().map(g => `<div class="game"><div><b>${g.opp ? 'vs ' + esc(g.opp) : 'Game'}</b> <span class="num">${esc(g.date)}${g.final ? ' · ' + (g.final.us > g.final.them ? 'W ' : g.final.us < g.final.them ? 'L ' : 'T ') + g.final.us + '–' + g.final.them : ''}</span><br><span>${Object.keys(g.mins || {}).length} players</span></div>
      ${UI.armed === 'g-' + g.id ? `<button class="btn small danger" data-act="delGame" data-id="${g.id}">Delete</button>` : `<button class="btn small" data-act="arm" data-key="g-${g.id}">Delete</button>`}</div>`).join('')}</div>
  </section>
  ${backupHTML()}`;
}

// On-floor impact: how the score moved while each player was on vs. off the floor, from scores typed at subs.
function impactHTML(){
  const st = {};
  let scored = 0;
  S.history.forEach(g => (g.stints || []).forEach(t => {
    if (t.d == null) return;
    scored += t.len;
    Object.keys(g.mins || {}).forEach(id => {
      const r = st[id] = st[id] || {on:0, od:0, off:0, fd:0};
      if (t.l.includes(id)){ r.on += t.len; r.od += t.d; } else { r.off += t.len; r.fd += t.d; }
    });
  }));
  const q = S.settings.qLen || 7;
  const sgn = v => (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + mins(Math.abs(v));
  const slip = avgSlip();
  const timing = slip == null ? '' : `<p class="help">Mid-quarter subs have gone in ${slip >= 0 ? fmt(slip) + ' late' : fmt(-slip) + ' early'} on average.</p>`;
  if (!scored) return `<section class="block"><h2>On-floor impact</h2>
    <div class="card"><p class="help">Type the score at each sub in live mode (it's optional) and this shows how the team does with each player on the floor. That tells you which developing player costs the least, and who to pair her with.</p></div>${timing}</section>`;
  const R = ranked().filter(p => st[p.id] && st[p.id].on > 0);
  const rows = R.map(p => { const r = st[p.id];
    const perOn = r.on >= q ? r.od / r.on * q : null, perOff = r.off >= q ? r.fd / r.off * q : null;
    return `<tr class="${r.on < 3 * q ? 'thin' : ''}"><td>${nameHTML(p.id)} <span class="tag ${p.tier}">${tierWord(p.tier)}</span></td><td>${mins(r.on)}</td><td>${sgn(r.od)}</td>
      <td>${perOn == null ? '–' : sgn(perOn)}</td><td>${perOn == null || perOff == null ? '–' : sgn(perOn - perOff)}</td></tr>`; }).join('');
  return `<section class="block">
    <div class="block-head"><h2>On-floor impact</h2><p class="sub num">${mins(scored)} scored min</p></div>
    <div class="grid-wrap"><table class="stable"><thead><tr><th>Player</th><th>Min</th><th>+/−</th><th>Per qtr</th><th>vs off</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="help"><b>Per qtr</b> is the team's point margin per ${q}-minute quarter with her on the floor. <b>vs off</b> compares it with when she sits. Faded rows have under ${3 * q} minutes, so treat them as a hint, not a verdict. With only 5 kids on the floor, a small sample swings a lot.</p>
    ${timing}
  </section>`;
}

// Every five-player group that has played with the score tracked, most minutes first.
function lineupsHTML(){
  const L = {};
  const sit = {close:{min:0, d:0, n:0}, dev:{min:0, d:0, n:0}};
  S.history.forEach(g => (g.stints || []).forEach(t => {
    if (t.d == null) return;
    const k = sortIds(t.l).join(',');
    const r = L[k] = L[k] || {ids:sortIds(t.l), min:0, d:0, n:0};
    r.min += t.len; r.d += t.d; r.n++;
    if (t.s && sit[t.s]){ sit[t.s].min += t.len; sit[t.s].d += t.d; sit[t.s].n++; }
  }));
  const rows = Object.values(L).sort((a, b) => b.min - a.min).slice(0, 8);
  if (!rows.length) return '';
  const q = S.settings.qLen || 7;
  const sgn = v => (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + mins(Math.abs(v));
  const devOf = r => r.ids.filter(id => { const p = byId(id); return p && tierOf(p) === 'dev'; });
  const sitLine = (k, label) => sit[k].n ? `<li><b>${label}</b> ${sit[k].n} stretch${sit[k].n > 1 ? 'es' : ''}, ${mins(sit[k].min)} min, ${sgn(sit[k].d)} points</li>` : '';
  const sl = sitLine('close', 'Best five in close games:') + sitLine('dev', 'Development fives with a big lead:');
  return `<section class="block">
    <div class="block-head"><h2>Lineups</h2><p class="sub">Most-used fives with the score tracked</p></div>
    <div class="lus">${rows.map(r => `<div class="lu"><div class="lu-n">${r.ids.map(id => { const p = byId(id); return `<span class="${p ? tierOf(p) : ''}">${esc(p ? p.name : '?')}</span>`; }).join('')}</div>
      <div class="lu-s num"><span>${mins(r.min)} min</span><b class="${r.d > 0 ? 'pos' : r.d < 0 ? 'neg' : ''}">${sgn(r.d)}</b><span>${r.min >= q ? sgn(r.d / r.min * q) + ' per qtr' : ''}</span></div></div>`).join('')}</div>
    ${sl ? `<ul class="sitsum">${sl}</ul>` : ''}
    <p class="help">Developing players are in purple, flex in teal, near core in gold. A five needs a few games together before its number means much.</p>
  </section>`;
}

function backupHTML(){
  return `<section class="block" id="backup">
    <h2>Backup &amp; roster code</h2>
    <div class="card fields">
      <p class="help">Data lives on this phone only. Copy a backup code to move it to another phone or keep it safe.</p>
      <button class="btn" data-act="copyBackup">Copy backup code</button>
      <label class="flabel" for="restore">Load a roster or backup code</label>
      <textarea class="in-txt" id="restore" placeholder="Paste the code here"></textarea>
      <button class="btn primary" data-act="restore">Load code</button>
    </div>
  </section>`;
}

/* ---------- sheet ---------- */
function sheetHTML(){
  const sh = UI.sheet;
  if (sh.type === 'pick'){
    const P = S.plan, g = P.segs[sh.seg], m = Engine.minutes(P.segs);
    const bench = ranked().filter(p => P.present.includes(p.id) && !P.out.includes(p.id) && !g.lineup.includes(p.id));
    const me = byId(sh.id), mm = m[sh.id] || {g:0, f:0};
    const isNext = P.cur != null && sh.seg === P.cur + 1, onNow = isNext ? P.segs[P.cur].lineup : [];
    return `<h3>${isNext ? 'Next sub: ' : ''}${esc(pname(sh.id))}</h3>
      <p class="help">${Engine.segLabel(g, P.s)} ${fmt(g.start)}–${fmt(g.end)} · ${mins(mm.g)} min planned in the game${P.s.fifth ? ', ' + mins(mm.f) + ' in the 5th Q' : ''}</p>
      ${bench.length ? `<div class="field"><span class="eyebrow">${isNext ? 'Who goes in instead?' : 'Swap in for this stretch'}</span><div class="opts">${bench.map(b => { const bm = m[b.id] || {g:0, f:0}; return `<button class="opt" data-act="swap" data-seg="${sh.seg}" data-out="${sh.id}" data-in="${b.id}"><span>${nameHTML(b.id)}${b.note ? `<em>${esc(b.note)}</em>` : ''}</span><span class="tag ${b.tier}">${tierWord(b.tier)}</span><small class="num">${onNow.includes(b.id) ? 'stays on' : mins(bm.g) + ' min'}</small></button>`; }).join('')}</div>
      <p class="help">Swapping locks this stretch. The rest of the game re-balances.</p></div>` : '<p class="help">Nobody is on the bench to swap in.</p>'}
      ${me ? `<button class="opt-danger" data-act="markOut" data-id="${sh.id}">Hurt / out for the rest of the game</button>` : ''}
      <button class="btn" data-act="closeSheet">Cancel</button>`;
  }
  if (sh.type === 'install') return installSteps();
  if (sh.type === 'copy'){
    return `<h3>Copy</h3><p class="help">Your phone didn't allow automatic copying. Select the text and copy it.</p>
      <textarea class="in-txt" id="copybox" style="height:220px" readonly>${esc(sh.text)}</textarea>
      <button class="btn" data-act="closeSheet">Done</button>`;
  }
  return '';
}

/* ---------- render ---------- */
function render(){
  $('#teamName').textContent = S.team || 'Team';
  const here = S.roster.filter(p => isHere(p.id)).length;
  $('#topPill').innerHTML = `<b class="num">${here}</b> of ${S.roster.length} here`;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  const v = {today:viewToday, rotation:viewRotation, roster:viewRoster, season:viewSeason}[S.tab] || viewToday;
  $('#app').innerHTML = v();
  const sh = $('#sheet');
  if (UI.sheet){
    sh.innerHTML = `<button class="sheet-bg" data-act="closeSheet" aria-label="Close"></button><div class="sheet-panel" role="dialog" aria-modal="true">${sheetHTML()}</div>`;
    sh.hidden = false;
  } else { sh.hidden = true; sh.innerHTML = ''; }
  save();
}

/* ---------- clipboard ---------- */
function copyText(text, okMsg){
  const fallback = () => { UI.sheet = {type:'copy', text}; render(); const b = $('#copybox'); if (b){ b.focus(); b.select(); } };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function planText(){
  const P = S.plan, s = P.s, m = Engine.minutes(P.segs);
  const lines = [`${S.team}${P.opp ? ' vs ' + P.opp : ''} — sub sheet`];
  P.segs.forEach((g, i) => {
    const prev = P.segs[i - 1];
    let line = `${Engine.segLabel(g, s)} ${fmt(g.start)}-${fmt(g.end)}: `;
    if (!prev || prev.kind !== g.kind) line += sortIds(g.lineup).map(id => pname(id)).join(', ');
    else { const {ins, outs} = changes(prev, g); line += ins.length ? `IN ${ins.map(id => pname(id)).join(', ')} / OUT ${outs.map(id => pname(id)).join(', ')}` : 'no change'; }
    lines.push(line);
  });
  lines.push('', 'Minutes (game' + (s.fifth ? ' + 5th Q' : '') + '):');
  ranked().filter(p => P.present.includes(p.id)).forEach(p => { const mm = m[p.id] || {g:0, f:0}; lines.push(`${pname(p.id)}: ${mins(mm.g)}${s.fifth ? ' + ' + mins(mm.f) : ''}`); });
  return lines.join('\n');
}

/* ---------- wake lock for live mode ---------- */
let wake = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
    if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.plan && S.plan.cur != null && S.tab === 'rotation') keepAwake(true); });

// Refresh the live card after typing a score (margin + suggestion) without stealing focus from the box being typed in.
function rerenderLive(){
  if (!S.plan || S.plan.cur == null) return;
  const sc = readScore(), m = sc ? sc.us - sc.them : null;
  const el = document.querySelector('.sb-m');
  if (el) el.textContent = m == null ? 'Enter score' : m > 0 ? 'Up ' + m : m < 0 ? 'Down ' + -m : 'Tied';
  const st = document.querySelector('.scorebox .cue'); if (st) st.remove();
  const box = document.getElementById('situ'); if (box) box.innerHTML = situationHTML();
}

/* ---------- actions ---------- */
const A = {
  tab(d){ S.tab = d.tab; UI.sheet = null; window.scrollTo(0, 0); },
  toggleHere(d){ S.here[d.id] = !isHere(d.id); },
  set(d){
    const v = JSON.parse(d.val);
    S.settings[d.key] = v;
    if (d.key === 'periods' && !lenOptions(S.settings).includes(S.settings.qLen)) S.settings.qLen = v === 2 ? 14 : 6;
  },
  arm(d){ UI.armed = d.key; return 'keepArm'; },
  build(){ buildPlan(); S.tab = 'rotation'; window.scrollTo(0, 0); toast('Rotation built'); },
  useSuggestion(){
    const P = S.plan, sit = situation(); if (!sit) return;
    const five = suggestion(sit); if (!five) return;
    const nx = P.segs[P.cur + 1];
    nx.lineup = five; nx.locked = true; nx.situ = sit.kind;
    replan();
    toast(sit.kind === 'close' ? 'Best five set for the next stretch' : 'Development five set for the next stretch');
  },
  liveStart(){ S.plan.cur = 0; S.plan.live = true; S.plan.score = S.plan.score || {us:'', them:''}; keepAwake(true); window.scrollTo(0, 0); },
  liveNext(d){
    const P = S.plan, i = P.cur, g = P.segs[i], nx = P.segs[i + 1];
    let moved = false;
    if (midQuarter(g, nx)){
      const t = d && d.t != null ? +d.t : plannedEnd(g);
      moved = setBoundary(i, t);
      g.slip = Math.round((plannedEnd(g) - g.end) * 100) / 100;
      g.logged = true;
    }
    if (g.kind === 'game'){ const sc = readScore(); if (sc) g.sc = sc; }
    P.scoreTouched = false;
    P.cur = Math.min(P.segs.length, i + 1);
    if (moved && P.cur < P.segs.length){
      replan();
      toast(Math.abs(g.slip) < 0.01 ? 'Back to the planned time. Rest of the game re-balanced.' : g.slip > 0 ? `Subs went in ${fmt(g.slip)} late. Rest of the game re-balanced.` : `Subs went in ${fmt(-g.slip)} early. Rest of the game re-balanced.`);
    }
    if (P.cur >= P.segs.length) keepAwake(false);
  },
  livePrev(){ S.plan.cur = Math.max(0, S.plan.cur - 1); },
  liveExit(){ S.plan.cur = null; keepAwake(false); },
  install(){
    if (installEvt){
      const ev = installEvt; installEvt = null;
      ev.prompt();
      ev.userChoice.then(c => { if (c.outcome === 'accepted'){ S.installDismissed = true; render(); } }).catch(() => {});
      return 'noRender';
    }
    UI.sheet = {type:'install'};
  },
  installLater(){ S.installDismissed = true; },
  goBackup(){ S.tab = 'season'; UI.sheet = null; render(); const b = document.getElementById('backup'); if (b) b.scrollIntoView(); return 'noRender'; },
  pick(d){ UI.sheet = {type:'pick', seg:+d.seg, id:d.id}; },
  closeSheet(){ UI.sheet = null; },
  swap(d){
    const g = S.plan.segs[+d.seg];
    g.lineup = g.lineup.map(x => x === d.out ? d.in : x);
    g.locked = true;
    replan(); UI.sheet = null;
    const w = lineupWarn(g);
    toast(`${pname(d.in, false)} in for ${pname(d.out, false)}${w ? ' · ' + w.msg : ''}`);
  },
  unlock(d){ S.plan.segs[+d.seg].locked = false; replan(); },
  markOut(d){
    const P = S.plan;
    if (!P.out.includes(d.id)) P.out.push(d.id);
    const live = P.cur != null && P.cur < P.segs.length;
    let msg = `${pname(d.id, false)} is out. Minutes re-balanced.`;
    // On the floor right now: swap in one replacement and leave the other four alone.
    if (live && P.segs[P.cur].lineup.includes(d.id)){
      const g = P.segs[P.cur], sub = bestReplacement(P.cur, d.id);
      g.lineup = g.lineup.map(x => x === d.id ? sub : x).filter(Boolean);
      g.locked = true;
      if (sub) msg = `${pname(sub, false)} in for ${pname(d.id, false)}. Rest of the game re-balanced.`;
    }
    const from = P.cur == null ? 0 : P.cur + 1;
    P.segs.forEach((g, i) => { if (i >= from && g.locked && g.lineup.includes(d.id)) g.locked = false; });
    replan(); UI.sheet = null; toast(msg);
  },
  syncHere(){
    const P = S.plan;
    const missing = S.roster.filter(p => isHere(p.id) && !P.present.includes(p.id)).map(p => p.id);
    const gone = P.present.filter(id => byId(id) && !isHere(id) && !P.out.includes(id));
    const fresh = P.cur == null && !P.segs.some(g => g.locked) && !P.out.length;
    if (fresh){ buildPlan(); toast('Rotation rebuilt with today\'s players'); return; }
    missing.forEach(id => P.present.push(id));
    gone.forEach(id => A.markOut({id}));
    replan();
    if (JSON.stringify(P.s) === JSON.stringify(S.settings)) P.key = planKey();
    toast(missing.length ? `${missing.map(id => pname(id, false)).join(', ')} added. Rest of the game re-balanced.` : 'Rotation updated');
  },
  returnIn(d){ S.plan.out = S.plan.out.filter(x => x !== d.id); replan(); toast(`${pname(d.id, false)} is back in the rotation`); },
  saveGame(){
    const P = S.plan, m = Engine.minutes(P.segs), out = {};
    P.present.forEach(id => { if (byId(id)) out[id] = m[id] || {g:0, f:0}; });
    const slips = P.live ? P.segs.filter((g, i) => g.kind === 'game' && g.logged && midQuarter(g, P.segs[i + 1]) && changes(g, P.segs[i + 1]).ins.length).map(g => g.slip || 0) : [];
    const entry = {id:P.savedId || uid(), date:new Date().toLocaleDateString('en-CA'), opp:P.opp || '', mins:out, stints:stintMargins(P.segs), slips};
    const lastSc = P.segs.filter(g => g.kind === 'game' && g.sc).pop();
    if (lastSc && P.segs.filter(g => g.kind === 'game').pop().sc) entry.final = lastSc.sc;
    const i = S.history.findIndex(g => g.id === entry.id);
    if (i >= 0) { entry.date = S.history[i].date; S.history[i] = entry; } else S.history.push(entry);
    P.savedId = entry.id;
    toast('Saved to season');
  },
  copyPlan(){ copyText(planText(), 'Sub sheet copied'); return 'noRender'; },
  move(d){
    const i = S.roster.findIndex(p => p.id === d.id), j = i + (+d.dir);
    if (j < 0 || j >= S.roster.length) return;
    [S.roster[i], S.roster[j]] = [S.roster[j], S.roster[i]];
    S.sample = false;
  },
  addPlayer(){ S.roster.push({id:uid(), name:'New player', num:'', tier:'dev'}); S.sample = false; },
  delPlayer(d){ S.roster = S.roster.filter(p => p.id !== d.id); delete S.here[d.id]; S.sample = false; },
  resetAll(){ const t = S.tab; S = fresh(); S.tab = t; },
  delGame(d){ S.history = S.history.filter(g => g.id !== d.id); },
  copyBackup(){ copyText(JSON.stringify({team:S.team, roster:S.roster, settings:S.settings, history:S.history}), 'Backup code copied'); return 'noRender'; },
  restore(){
    const box = $('#restore');
    try {
      const d = JSON.parse(box.value.trim());
      if (!Array.isArray(d.roster) || !d.roster.length) throw new Error('no roster');
      S.team = d.team || S.team; S.roster = d.roster; S.settings = {...DEFAULT_SETTINGS, ...(d.settings || {})};
      S.history = Array.isArray(d.history) ? d.history : []; S.plan = null; S.sample = false; S.here = {};
      S.tab = 'today'; window.scrollTo(0, 0);
      toast(`Loaded ${S.roster.length} players`);
    } catch (e) { toast('That code didn\'t work. Copy the whole backup code and try again.'); return 'noRender'; }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (UI.armed && !e.target.closest('input,textarea,select')) { UI.armed = null; render(); } return; }
  const fn = A[el.dataset.act];
  if (!fn) return;
  const r = fn(el.dataset, el);
  if (r !== 'keepArm') UI.armed = null;
  if (r !== 'noRender') render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pf && t.dataset.pf !== 'tier'){
    const p = byId(t.dataset.id); if (p){ p[t.dataset.pf] = t.value; S.sample = false; save(); }
  } else if (t.dataset.team !== undefined){ S.team = t.value; $('#teamName').textContent = t.value || 'Team'; save(); }
  else if (t.dataset.planField && S.plan){ S.plan[t.dataset.planField] = t.value; save(); }
  else if (t.dataset.score && S.plan){ S.plan.score = S.plan.score || {us:'', them:''}; S.plan.score[t.dataset.score] = t.value.replace(/\D/g, ''); S.plan.scoreTouched = true; save(); clearTimeout(UI.scoreT); UI.scoreT = setTimeout(rerenderLive, 250); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf === 'tier'){ const p = byId(t.dataset.id); if (p){ p.tier = t.value; S.sample = false; render(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet){ UI.sheet = null; render(); } });

render();
</script>
</body></html>
